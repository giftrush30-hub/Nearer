name: Android unit tests

on:
  push:
    branches:
      - feature/premium-onboarding-identity
  pull_request:
    branches:
      - main
      - feature/premium-onboarding-identity

permissions:
  contents: read

concurrency:
  group: android-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Compile and run JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0

      - name: Install compatible Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Intentionally do not assemble or publish an APK in this workflow.
      - name: Compile app and run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
