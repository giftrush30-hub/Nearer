name: Android unit tests

on:
  workflow_dispatch:
  push:
    branches:
      - feature/premium-onboarding-identity
  pull_request:
    branches:
      - main
      - feature/premium-onboarding-identity

permissions:
  contents: read

concurrency:
  group: android-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Compile and run JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools were not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Install compatible Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Intentionally do not assemble or publish an APK in this workflow.
      - name: Compile app and run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      # This is an installable debug/test APK for real-phone validation, not a
      # production-signed Play Store release.
      - name: Assemble installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Check APK size
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SIZE="$(stat -c%s "$APK")"
          echo "Debug APK size: $SIZE bytes"
          if [ "$SIZE" -gt $((30 * 1024 * 1024)) ]; then
            echo "::warning::Debug APK exceeds the 30 MiB target. A minified release build must be measured separately."
          fi

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nearer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
