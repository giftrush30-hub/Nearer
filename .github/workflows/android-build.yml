name: Android validation and APK

on:
  push:
    branches: [main, integration/nearer-complete-app, phase-1-smartconnect, fix/studio-native-capture-privacy]
  pull_request:
    branches: [main, integration/nearer-complete-app, feature/messaging-people-chat-inbox]
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Build and upload an installable APK (only when explicitly requested)"
        required: false
        type: boolean
        default: false

concurrency:
  group: nearer-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run JVM tests and validate Android manifest (no APK)
        run: gradle --no-daemon --stacktrace testDebugUnitTest processDebugManifest

      - name: Build installable debug APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_apk == true
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_apk == true
        uses: actions/upload-artifact@v4
        with:
          name: NeaRer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
