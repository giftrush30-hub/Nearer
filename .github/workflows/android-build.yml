name: Android unit tests (no APK)

on:
  push:
    branches: [ main, feature/game-zone-ludo, feature/nearer-ui-polish, feature/nearer-premium-blue-gold-ludo, feature/royal-electric-redesign ]
  workflow_dispatch:

concurrency:
  group: nearer-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests only
        run: gradle --no-daemon --stacktrace testDebugUnitTest
