name: NeaRer code validation

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  # Branch pushes already validate the exact commit that a PR will propose.
  # Avoid a duplicate pull_request job for the same branch revision.
  group: nearer-validation-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile app, run unit tests, and assemble installable APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug

      - name: Upload Android lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeaRer-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload NeaRer debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NeaRer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
