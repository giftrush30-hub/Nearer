name: NeaRer code validation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A PR push and its pull_request event share the same head-branch group,
  # preventing duplicate Gradle jobs for the same source revision.
  group: nearer-validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Validation compiles the app and runs JVM tests, but deliberately does
      # not run assembleDebug or create an APK.
      - name: Compile app and run unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest
