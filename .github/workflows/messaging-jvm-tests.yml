name: Messaging JVM tests + manifest validation (no APK)
# Deliberately runs only JVM tests; never assembles or uploads an Android package.

on:
  push:
    branches:
      - work/messaging-service-owned-nearby
    paths:
      - "app/src/main/AndroidManifest.xml"
      - "app/build.gradle.kts"
      - "app/src/main/java/com/nearer/app/**"
      - "app/src/test/java/com/nearer/app/**"
      - ".github/workflows/messaging-jvm-tests.yml"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nearer-messaging-jvm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  messaging-jvm-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run JVM tests and validate Android manifest (no APK)
        run: gradle --no-daemon --stacktrace testDebugUnitTest processDebugManifest lintDebug
