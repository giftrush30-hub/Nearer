name: Messaging JVM tests + manifest validation (no APK)
# Deliberately runs only JVM tests; never assembles or uploads an Android package.

on:
  push:
    branches:
      - "work/messaging-*"
    paths:
      - "app/src/main/AndroidManifest.xml"
      - "app/build.gradle.kts"
      - "app/src/main/java/com/nearer/app/**"
      - "app/src/test/java/com/nearer/app/**"
      - ".github/workflows/messaging-jvm-tests.yml"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nearer-messaging-jvm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  messaging-jvm-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run JVM tests and validate Android manifest (no APK)
        run: gradle --no-daemon --stacktrace testDebugUnitTest processDebugManifest

      - name: Run Android lint (diagnostic; existing baseline is not yet clean)
        run: gradle --no-daemon --stacktrace lintDebug
        continue-on-error: true

      - name: Upload Android lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report-${{ github.run_id }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 7
