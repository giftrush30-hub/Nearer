name: NeaRer
options:
  bundleIdPrefix: com.nearer
  deploymentTarget:
    iOS: "16.0"
packages:
  NeaRerPlatform:
    path: ../NeaRerWire
targets:
  NeaRer:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: ../Configuration/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nearer.ios
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: NeaRerPlatform
        product: NeaRerWire
      - package: NeaRerPlatform
        product: NeaRerTransport
